name: Check cloud censor source
on:
  push:
    branches: [features/cloud-censor-20261031, validation/cloud-censor-20261031]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: censor-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: python3 scripts/ensure_android.py
      - run: python3 qa/colab-censor.test.py
      - name: Prepare silent-window and playback fixtures
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          ffmpeg -v error -y -f lavfi -i color=c=red:s=160x90:r=10:d=1 -f lavfi -i color=c=green:s=160x90:r=10:d=1 -f lavfi -i color=c=blue:s=160x90:r=10:d=1 -f lavfi -i sine=frequency=440:sample_rate=44100 -filter_complex "[0:v][1:v][2:v]concat=n=3:v=1:a=0[v]" -map "[v]" -map 3:a -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac app/src/androidTest/assets/censor-time.mp4
          ffmpeg -v error -y -display_rotation:v:0 90 -i app/src/androidTest/assets/censor-time.mp4 -c copy app/src/androidTest/assets/censor-time-rotated.mp4
          ffmpeg -v error -y -f lavfi -i testsrc2=size=160x90:rate=15 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 24 -c:v libx264 -preset ultrafast -crf 35 -c:a aac -movflags +faststart app/src/androidTest/assets/watch-long.mp4
      - name: Compile actual Android integration and tests
        run: gradle --no-daemon -PvalidationBuild=true :app:compileDebugJavaWithJavac :app:compileDebugAndroidTestJavaWithJavac :app:testDebugUnitTest :app:lintDebug
      - name: Disposable validation signing key
        run: |
          echo "MADAR_VALIDATION_KEYSTORE=$RUNNER_TEMP/censor-debug.keystore" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/censor-debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Madar censor validation" -keyalg RSA -keysize 2048 -validity 2
      - run: gradle --no-daemon -PvalidationBuild=true :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual video compositing and strict media-time masks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell am instrument -w -r -e class com.madar.files.CensorTimelineTest,com.madar.files.CensorRenderTest,com.madar.files.CensorPlaybackTest,com.madar.files.CensorVideoWindowTest,com.madar.files.CensorCloudJobTest com.madar.files.validation.test/androidx.test.runner.AndroidJUnitRunner > censor-render-result.txt
            cat censor-render-result.txt
            python3 -c 'from pathlib import Path;import re;s=Path("censor-render-result.txt").read_text();assert re.search(r"OK\s*\(13 tests\)",s) and not re.search(r"INSTRUMENTATION_STATUS_CODE:\s*-\d+|INSTRUMENTATION_FAILED|FAILURES!!!",s), "All actual censor playback and rendering regressions must pass"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: censor-source-validation
          path: |
            censor-render-result.txt
            app/build/reports/

