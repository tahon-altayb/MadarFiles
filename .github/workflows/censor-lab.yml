name: Censor lab (real models on CPU)
on:
  push:
    branches: ['lab/censor-*']
jobs:
  lab:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [new]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --disable-pip-version-check torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.2.6 opencv-python-headless==4.12.0.88 ultralytics==8.3.203 timm==0.8.13.dev0 huggingface-hub==0.36.0 safetensors==0.6.2
      - run: |
          if [ "${{ matrix.variant }}" = old ]; then mkdir -p "$RUNNER_TEMP/old" && for f in censor_engine censor_tracking censor_profile; do git show fe02da9:app/src/main/assets/colab/$f.py > "$RUNNER_TEMP/old/$f.py"; done; cp app/src/main/assets/colab/drive_model_cache.py "$RUNNER_TEMP/old/" 2>/dev/null || true; ASSETS="$RUNNER_TEMP/old"; else ASSETS=app/src/main/assets/colab; fi
          python qa/censor-lab.py "$ASSETS" "$RUNNER_TEMP/models" lab-out female
      - name: Publish results to a branch
        if: always()
        run: |
          cd lab-out && git init -q && git checkout -q -b lab-results-${{ matrix.variant }}
          git -c user.name=lab -c user.email=lab@madar add -A && git -c user.name=lab -c user.email=lab@madar commit -qm results
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lab-results-${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: censor-lab-${{ matrix.variant }}
          path: lab-out
