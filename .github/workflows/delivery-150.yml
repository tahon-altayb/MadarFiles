name: Prepare verified MadarFiles 1.5.0 download
on:
  push:
    branches: [delivery/1.5.0-apk]
permissions:
  actions: read
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require verified original build
        uses: actions/github-script@v7
        with:
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: 40184131848});
            if (run.conclusion !== 'success' || run.head_sha !== '4eae2e60881663e789d26a2767b4a6633071bcac') throw new Error('Unexpected original build');
      - uses: actions/download-artifact@v4
        with:
          name: MadarFiles-1.5.0-APK
          path: package
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40184131848
      - name: Split existing signed APK without rebuilding
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          apk=pathlib.Path('package/MadarFiles-1.5.0.apk')
          root=pathlib.Path('delivery');root.mkdir()
          manifest={'name':apk.name,'bytes':apk.stat().st_size,'sha256':hashlib.file_digest(apk.open('rb'),'sha256').hexdigest(),'source_run':40184131848,'source_commit':'4eae2e60881663e789d26a2767b4a6633071bcac','parts':[]}
          with apk.open('rb') as source:
            for index in range(6):
              data=source.read(96*1024*1024)
              if not data:raise RuntimeError('Unexpected APK part count')
              name=f'MadarFiles-1.5.0.apk.part{index:02d}'
              folder=root/f'part{index:02d}';folder.mkdir()
              (folder/name).write_bytes(data)
              manifest['parts'].append({'name':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
            if source.read(1):raise RuntimeError('APK exceeds prepared transport size')
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps({key:manifest[key] for key in ['name','bytes','sha256','source_commit']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MadarFiles-1.5.0-manifest
          path: delivery/manifest.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: MadarFiles-1.5.0-part00
          path: delivery/part00/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: MadarFiles-1.5.0-part01
          path: delivery/part01/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: MadarFiles-1.5.0-part02
          path: delivery/part02/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: MadarFiles-1.5.0-part03
          path: delivery/part03/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: MadarFiles-1.5.0-part04
          path: delivery/part04/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: MadarFiles-1.5.0-part05
          path: delivery/part05/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
