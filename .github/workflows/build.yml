name: Build MadarFiles APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore personal development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: madar-personal-development-key-v1
      - name: Validate interface
        run: node qa/interface.test.cjs
      - name: Build and lint APK
        run: gradle --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk MadarFiles-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MadarFiles-1.0.0-APK
          path: MadarFiles-1.0.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device processing tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.madar.files/.MainActivity
            sleep 3
            mkdir -p phone-screenshots
            adb shell screencap -p /sdcard/madar-home.png
            adb pull /sdcard/madar-home.png phone-screenshots/home.png
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MadarFiles-verification
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            phone-screenshots/
