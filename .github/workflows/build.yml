name: Build MadarFiles APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        timeout-minutes: 10
        run: python3 scripts/ensure_android.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Load signing key from GitHub Secrets
        env:
          MADAR_KEYSTORE_BASE64: ${{ secrets.MADAR_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYKEY'
          import os,base64,pathlib
          value=os.environ.get('MADAR_KEYSTORE_BASE64','')
          if not value:
              raise SystemExit('Configure MADAR_KEYSTORE_BASE64 and signing passwords in GitHub Secrets; do not generate a replacement key for an installed app.')
          dest=pathlib.Path('.signing/madar-development.keystore')
          dest.parent.mkdir(mode=0o700,exist_ok=True)
          dest.write_bytes(base64.b64decode(value,validate=True))
          dest.chmod(0o600)
          PYKEY
      - name: Restore processing build assets
        uses: actions/cache@v4
        with:
          path: |
            app/vendor
            app/src/main/jniLibs
            app/src/main/assets/models
          key: madar-engines-v1-${{ hashFiles('scripts/prepare_*.py') }}
      - name: Prepare offline model and native assets
        run: |
          python3 scripts/prepare_models.py
          python3 scripts/prepare_lame.py
          python3 scripts/prepare_containers.py
      - name: Persist processing build assets
        uses: actions/cache/save@v4
        with:
          path: |
            app/vendor
            app/src/main/jniLibs
            app/src/main/assets/models
          key: madar-engines-v1-${{ hashFiles('scripts/prepare_*.py') }}
      - name: Prepare speech and music test fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models/qi-feng-le-zh.wav -o /tmp/speech.wav
          ffmpeg -y -f lavfi -i testsrc2=size=320x240:rate=24 -i /tmp/speech.wav -f lavfi -i "sine=frequency=997:sample_rate=44100" -filter_complex "[1:a]aresample=44100,volume=0.8[s];[2:a]volume=0.3[m];[s][m]amix=inputs=2:normalize=0,pan=stereo|c0=c0|c1=c0[a]" -map 0:v -map "[a]" -t 3 -c:v libx264 -c:a aac app/src/androidTest/assets/music-test.mp4
          espeak-ng -v en-us -s 135 -w app/src/androidTest/assets/speech-test.wav "The quick brown fox jumps over the lazy dog. Welcome to this video. This is a test of speech recognition."
      - name: Validate interface
        run: node qa/interface.test.cjs
      - name: Build and lint APK
        env:
          MADAR_STORE_PASSWORD: ${{ secrets.MADAR_STORE_PASSWORD }}
          MADAR_KEY_PASSWORD: ${{ secrets.MADAR_KEY_PASSWORD }}
          MADAR_KEY_ALIAS: ${{ secrets.MADAR_KEY_ALIAS }}
        run: gradle --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk MadarFiles-1.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MadarFiles-1.2.0-APK
          path: MadarFiles-1.2.0.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device processing tests
        env:
          MADAR_STORE_PASSWORD: ${{ secrets.MADAR_STORE_PASSWORD }}
          MADAR_KEY_PASSWORD: ${{ secrets.MADAR_KEY_PASSWORD }}
          MADAR_KEY_ALIAS: ${{ secrets.MADAR_KEY_ALIAS }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.madar.files/.MainActivity
            sleep 3
            mkdir -p phone-screenshots
            adb shell screencap -p /sdcard/madar-home.png
            adb pull /sdcard/madar-home.png phone-screenshots/home.png
            adb pull /data/local/tmp/madar-clean.mp4 phone-screenshots/clean-music-test.mp4 || echo "Optional audio evidence unavailable; see processing test results"
            adb pull /data/local/tmp/madar-player.png phone-screenshots/player.png || true
            adb pull /data/local/tmp/madar-crop.png phone-screenshots/crop.png || true
            cp app/src/androidTest/assets/music-test.mp4 phone-screenshots/original-music-test.mp4
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MadarFiles-verification
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            phone-screenshots/
            app/src/main/assets/models/checksums.json
      - name: Remove temporary signing material
        if: always()
        run: rm -f .signing/madar-development.keystore
