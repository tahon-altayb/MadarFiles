name: Stop superseded motion validation runs
on:
  push:
    branches: [qa/stop-superseded-motion-20261105]
permissions:
  contents: read
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only known older validation revisions
        env:
          GH_TOKEN: ${{ github.token }}
          MADAR_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          repo=os.environ['MADAR_REPO']
          assert repo=='tahon-altayb/MadarFiles'
          old={'333eb478b5fbabc091fd38adda7c1237deb2495a','09d6e6da8be6833f5c4bb2e805d24d9de6bffc4d'}
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          base='https://api.github.com/repos/'+repo+'/actions/runs'
          with urllib.request.urlopen(urllib.request.Request(base+'?per_page=100',headers=headers),timeout=30) as f:runs=json.load(f)['workflow_runs']
          for r in runs:
              if r['head_sha'] not in old or r['head_branch'] not in {'features/product-motion-20261103','qa/motion-final-20261105'} or r['status']=='completed':continue
              req=urllib.request.Request(base+'/'+str(r['id'])+'/cancel',data=b'',headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as f:f.read()
                  print('Stopped superseded validation',r['id'])
              except urllib.error.HTTPError as e:
                  if e.code!=409:raise
                  print('Already finishing',r['id'])
          PY
