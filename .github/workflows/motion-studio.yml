name: Validate motion studio runtime
on:
  push:
    branches: [features/motion-studio-20261102]
permissions:
  contents: read
concurrency:
  group: motion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          sudo apt-get -qq update
          sudo apt-get install -y -qq ffmpeg
          node qa/motion-clock.test.cjs
          python3 qa/motion-cloud.test.py
          python3 qa/motion-render.test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-runtime-evidence
          path: qa/evidence/motion/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: |
          python3 scripts/ensure_android.py
          gradle --no-daemon -PvalidationBuild=true :app:compileDebugJavaWithJavac :app:compileDebugAndroidTestJavaWithJavac :app:testDebugUnitTest :app:lintDebug
      - name: Create disposable validation key
        run: |
          echo "MADAR_VALIDATION_KEYSTORE=$RUNNER_TEMP/motion-validation.keystore" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$RUNNER_TEMP/motion-validation.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Madar Motion Validation"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -skin 480x800 -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle --no-daemon -PvalidationBuild=true :app:installDebug :app:installDebugAndroidTest
            adb shell wm density 180
            adb shell am instrument -w -r -e class com.madar.files.MotionStudioTest com.madar.files.validation.test/androidx.test.runner.AndroidJUnitRunner > motion-android.txt
            cat motion-android.txt
            python3 -c "import re; s=open('motion-android.txt').read(); assert re.search(r'OK\s*\(4 tests\)',s) and not re.search(r'INSTRUMENTATION_FAILED|FAILURES!!!|INSTRUMENTATION_STATUS_CODE:\s*-\d+',s)"
            adb pull /sdcard/Android/data/com.madar.files.validation/files/motion-studio.png motion-studio.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-android-evidence
          path: |
            motion-android.txt
            motion-studio.png
            app/build/reports/
            app/build/outputs/androidTest-results/
