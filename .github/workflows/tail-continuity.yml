name: Diagnose rolling audio continuity
on:
  push:
    branches: [qa/player-tail-20261104]
permissions:
  contents: read
jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android and a real player fixture
        run: |
          python3 scripts/ensure_android.py
          sudo apt-get -qq update
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -v error -y -f lavfi -i testsrc2=size=160x90:rate=15 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 24 -c:v libx264 -preset ultrafast -crf 35 -c:a aac app/src/androidTest/assets/watch-long.mp4
          echo "MADAR_VALIDATION_KEYSTORE=$RUNNER_TEMP/tail-validation.keystore" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$RUNNER_TEMP/tail-validation.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Madar Tail Validation"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -skin 480x800 -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle --no-daemon -PvalidationBuild=true :app:testDebugUnitTest :app:installDebug :app:installDebugAndroidTest
            adb shell wm density 180
            bash qa/tail-continuity.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tail-continuity-results
          path: tail-results/

