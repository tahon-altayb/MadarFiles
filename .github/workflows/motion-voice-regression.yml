name: Verify cold approved speech and saved-direction recovery
on:
  push:
    branches: [qa/motion-speech-20261105, features/product-motion-20261103]
permissions:
  contents: read
  actions: read
concurrency:
  group: speech-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    if: github.ref == 'refs/heads/qa/motion-speech-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: |
          python3 scripts/ensure_android.py
          gradle --no-daemon -PvalidationBuild=true :app:compileDebugJavaWithJavac :app:compileDebugAndroidTestJavaWithJavac :app:testDebugUnitTest :app:lintDebug
  voice:
    env:
      MPLBACKEND: module://matplotlib_inline.backend_inline
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: motion-generated-idea
          run-id: 41877551623
          github-token: ${{ github.token }}
          path: generated-project
      - name: Prepare renderer
        run: |
          sudo apt-get -o Acquire::Retries=2 -qq update
          sudo apt-get install -y -qq ffmpeg
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "MADAR_CHROME_PATH=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"
      - name: Generate approved voice and video from the retained direction
        run: python3 qa/motion-voices-real.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speech-recovery-evidence
          path: qa/evidence/voice-resume/
