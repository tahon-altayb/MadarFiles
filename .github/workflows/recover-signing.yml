name: One-time encrypted signing migration
on:
  push:
    branches: [development/media-tools-20261020]
permissions:
  contents: read
jobs:
  seal-existing-key:
    if: contains(github.event.head_commit.message, '[recover-signing]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore original key once, without any cache save
        id: original
        uses: actions/cache/restore@v4
        with:
          path: .signing/madar-development.keystore
          key: madar-personal-development-key-v2
          fail-on-cache-miss: true
      - name: Install encryption dependency
        run: python3 -m pip install --quiet cryptography==50.0.2
      - name: Validate original certificate and seal key to one-time recipient
        env:
          ORIGINAL_STORE_PASSWORD: android
        run: |
          python3 - <<'PY'
          import os,json,base64,hashlib,pathlib,subprocess
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          source=pathlib.Path('.signing/madar-development.keystore')
          cert=subprocess.check_output(['keytool','-exportcert','-keystore',str(source),'-alias','androiddebugkey','-storepass:env','ORIGINAL_STORE_PASSWORD'])
          expected='753b13a984815b725b41a8f2ae2ef07d9d9e8cc64811cbff004d5da8ccedfb5e'
          if hashlib.sha256(cert).hexdigest()!=expected:
              raise SystemExit('Unexpected certificate; no signing data exported')
          recipient=serialization.load_pem_public_key(pathlib.Path('.github/signing-transfer-public.pem').read_bytes())
          key=AESGCM.generate_key(bit_length=256);nonce=os.urandom(12)
          ciphertext=AESGCM(key).encrypt(nonce,source.read_bytes(),b'MadarFiles original signing migration v1')
          wrapped=recipient.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          encode=lambda value:base64.b64encode(value).decode('ascii')
          envelope={'version':1,'wrappedKey':encode(wrapped),'nonce':encode(nonce),'ciphertext':encode(ciphertext),'certificate':expected}
          pathlib.Path('signing-transfer.enc.json').write_text(json.dumps(envelope))
          print('Original certificate verified; only an encrypted one-time envelope will be uploaded')
          PY
      - name: Upload encrypted envelope only
        uses: actions/upload-artifact@v4
        with:
          name: MadarFiles-encrypted-signing-transfer
          path: signing-transfer.enc.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary key and envelope from runner
        if: always()
        run: rm -f .signing/madar-development.keystore signing-transfer.enc.json
