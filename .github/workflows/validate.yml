name: Validate development source
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check shared interface
        run: node qa/interface.test.cjs
      - name: Prepare Android tools
        run: python3 scripts/ensure_android.py
      - name: Compile Java, lint and unit tests (no APK signing)
        run: gradle :app:compileDebugJavaWithJavac :app:lintDebug :app:testDebugUnitTest --stacktrace
      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-validation-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
