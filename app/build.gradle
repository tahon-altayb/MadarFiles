plugins { id 'com.android.application' }
def validationBuild = providers.gradleProperty('validationBuild').orNull == 'true'
android {
    namespace 'com.madar.files'
    compileSdk 35
    ndkVersion '27.2.12479018'
    if (!validationBuild) { externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } } }
    defaultConfig {
        applicationId 'com.madar.files'
        if (validationBuild) { applicationIdSuffix '.validation' }
        minSdk 29
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        if (!validationBuild) { externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } } }
        targetSdk 35
        versionCode 16
        versionName '1.4.11'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { pickFirsts += ["**/libc++_shared.so"] } }
    signingConfigs { debug { storeFile validationBuild ? file(System.getenv("MADAR_VALIDATION_KEYSTORE") ?: System.getProperty("user.home")+"/.android/debug.keystore") : rootProject.file(".signing/madar-development.keystore"); storePassword validationBuild ? "android" : (System.getenv("MADAR_STORE_PASSWORD") ?: "android"); keyAlias validationBuild ? "androiddebugkey" : (System.getenv("MADAR_KEY_ALIAS") ?: "androiddebugkey"); keyPassword validationBuild ? "android" : (System.getenv("MADAR_KEY_PASSWORD") ?: "android") } }
    buildTypes {
        release {
            // Original release signing material is supplied by GitHub Secrets.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    lint { abortOnError true }
}
dependencies {
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.media3:media3-transformer:1.5.1'
    implementation 'androidx.media3:media3-effect:1.5.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
