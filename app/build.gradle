plugins { id 'com.android.application' }
android {
    namespace 'com.madar.files'
    compileSdk 35
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    defaultConfig {
        applicationId 'com.madar.files'
        minSdk 29
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { pickFirsts += ["**/libc++_shared.so"] } }
    signingConfigs { debug { storeFile rootProject.file(".signing/madar-development.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
    buildTypes {
        release {
            // Personal APK. A persistent signing secret can replace this before public distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    lint { abortOnError true }
}
dependencies {
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.media3:media3-transformer:1.5.1'
    implementation 'androidx.media3:media3-effect:1.5.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
