plugins { id 'com.android.application' }
// Optional project configuration; never a Gemini API credential.
def firebaseConfig = file('google-services.json')
def firebaseClient = null
def firebaseProject = null
if (firebaseConfig.isFile()) {
    def config = new groovy.json.JsonSlurper().parse(firebaseConfig)
    firebaseClient = config.client.find { it.client_info.android_client_info.package_name == 'com.madar.files' }
    if (!firebaseClient) throw new GradleException('Firebase config has no com.madar.files Android client')
    firebaseProject = config.project_info
}
def validationBuild = providers.gradleProperty('validationBuild').orNull == 'true'
android {
    namespace 'com.madar.files'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    if (!validationBuild) { externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } } }
    defaultConfig {
        applicationId 'com.madar.files'
        if (validationBuild) { applicationIdSuffix '.validation' }
        minSdk 29
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        if (!validationBuild) { externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } } }
        targetSdk 35
        versionCode 49
        versionName '1.9.14'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        if (firebaseClient != null && !validationBuild) {
            resValue 'string', 'google_app_id', firebaseClient.client_info.mobilesdk_app_id
            resValue 'string', 'google_api_key', firebaseClient.api_key[0].current_key
            resValue 'string', 'project_id', firebaseProject.project_id
            resValue 'string', 'gcm_defaultSenderId', firebaseProject.project_number
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true; pickFirsts += ["**/libc++_shared.so"] } }
    signingConfigs { debug { storeFile validationBuild ? file(System.getenv("MADAR_VALIDATION_KEYSTORE") ?: System.getProperty("user.home")+"/.android/debug.keystore") : rootProject.file(".signing/madar-development.keystore"); storePassword validationBuild ? "android" : (System.getenv("MADAR_STORE_PASSWORD") ?: "android"); keyAlias validationBuild ? "androiddebugkey" : (System.getenv("MADAR_KEY_ALIAS") ?: "androiddebugkey"); keyPassword validationBuild ? "android" : (System.getenv("MADAR_KEY_PASSWORD") ?: "android") } }
    buildTypes {
        release {
            // Original release signing material is supplied by GitHub Secrets.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    lint { abortOnError true }
}
